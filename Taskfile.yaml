version: "3"

vars:
  DOCKER_COMPOSE_FILE: ./deploy/docker-compose.yaml

tasks:
  docker:up:
    cmds:
      - docker compose --env-file ./.env -f {{.DOCKER_COMPOSE_FILE}} up -d --build

  docker:up:local:
    cmds:
      - docker compose --env-file ./.env -f {{.DOCKER_COMPOSE_FILE}} up -d postgres

  docker:down:
    cmds:
      - docker compose -f {{.DOCKER_COMPOSE_FILE}} down

  app:run:
    cmds:
      - npm run start

  app:run:local:
    cmds:
      - npm run start:dev

  app:build:
    cmds:
      - npm run build

  migration:up:
    cmds:
      - npm run migrate:dev

  migration:reset:
    cmds:
      - npm run migrate:reset

  db:seed:
    cmds:
      - npm run db:seed
